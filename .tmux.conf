# True color settings
set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"

# Statusbar

set-option -g status-style fg="#ffffff",bg="#5f5f5f"
set-option -g status-left-style fg="#ffffff",bg="#5f5f5f"
set-option -g status-right-style fg="#ffffff",bg="#5f5f5f"
set-option -g window-status-style fg="#ffffff",bg="#5f5f5f"
set-option -g window-status-current-style fg="#ffffff",bg="#5f5f5f"
set-option -g message-style fg="#ffffff",bg="#5f5f5f"

set-option -g status-position top

set -g status-right "#($HOME/.local/scripts/tmuxsb_git-branch.sh)"

# Keybinds

## Select-pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

## Prefix
unbind C-b
set-option -g prefix C-space
bind C-t send-prefix

## Splits
bind v split-window -h
bind s split-window -v

## Change session
bind , choose-session

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
# Changed to use Alt instead of Control

# decide whether we're in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'M-\\' if-shell \"$is_vim\" 'send-keys M-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'M-\\' if-shell \"$is_vim\" 'send-keys M-\\\\'  'select-pane -l'"

bind-key -n 'M-Space' if-shell "$is_vim" 'send-keys M-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R
bind-key -T copy-mode-vi 'M-\' select-pane -l
bind-key -T copy-mode-vi 'M-Space' select-pane -t:.+

# Unbind original ctrl keys
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l
unbind -n C-\\
unbind -n C-Space

# copy-mode
unbind -T copy-mode-vi C-h
unbind -T copy-mode-vi C-j
unbind -T copy-mode-vi C-k
unbind -T copy-mode-vi C-l
unbind -T copy-mode-vi C-\\
unbind -T copy-mode-vi C-Space
