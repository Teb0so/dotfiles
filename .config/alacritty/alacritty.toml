[env]
term = "xterm-256color"

[colors.cursor]
text    = "#ffffee"
cursor  = "#000000"

[colors.primary]
background = "#ffffee"
foreground = "#000000"

[colors.normal]
black   = "#000000"
red     = "#a52a2a"
green   = "#008000"
yellow  = "#b8860b"
blue    = "#0000ff"
magenta = "#800080"
cyan    = "#008080"
white   = "#c0c0c0"

[colors.bright]
black   = "#606060"
red     = "#cd5c5c"
green   = "#228b22"
yellow  = "#daa520"
blue    = "#4169e1"
magenta = "#9932cc"
cyan    = "#20b2aa"
white   = "#ffffff"

[font]
size = 14

[font.normal]
family = "IosevkaTermSlabNerdFont"
style  = "Regular"

[font.bold]
family = "IosevkaTermSlabNerdFont"
style  = "Bold"

[font.italic]
family = "IosevkaTermSlabNerdFont"
style  = "Italic"
